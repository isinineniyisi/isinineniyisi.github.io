<html lang="tr"><head><meta charset="utf-8">
<title>Doğan Kavi / Doğan Endüstriyel — kartvizit</title>
<style>@page{size:85.0mm 55.0mm;margin:0}
*{box-sizing:border-box;margin:0;padding:0;-webkit-print-color-adjust:exact;
 print-color-adjust:exact}
body{background:#8a8a8a;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
 color:#0d1b3e}
.sayfa{position:relative;width:85.0mm;height:55.0mm;overflow:hidden;
 background:#fff;page-break-after:always;break-after:page}
.sayfa:last-child{page-break-after:auto;break-after:auto}
.kesim i{position:absolute;background:#999;z-index:9}
/* kart yüzeyi taşma payının içinde başlar; zemin taşmaya kadar uzar */
.yuz{position:absolute;left:0;top:0;width:85.0mm;height:55.0mm}
.ic{position:absolute;left:0.0mm;top:0.0mm;width:85.0mm;height:55.0mm}

/* ---------------- ÖN YÜZ ---------------- */
.on{background:#fdfdfa}
.cerceve{position:absolute;left:2.6mm;top:2.6mm;
 width:79.8mm;height:49.8mm;border:0.28mm solid #c9a227}
/* genişlik mührün sol kenarında biter (85 - 5.6 sağ - 13 mühür - 3 boşluk - 6.4 sol) */
.govde{position:absolute;left:6.4mm;top:6.2mm;width:57.0mm}
.logo{max-width:34mm;max-height:9.2mm;object-fit:contain;
 object-position:left center;display:block;margin-bottom:2.4mm}
.marka{font-size:15.5pt;font-weight:800;letter-spacing:.005em;line-height:1.06;
 color:#0d1b3e}
.unvan{font-size:5.5pt;line-height:1.38;color:#6a7183;margin-top:1.5mm;
 letter-spacing:.012em}
.cizgi{width:13mm;height:0.42mm;background:#c9a227;margin:2.6mm 0 2.4mm}
.kisi{font-size:8.6pt;font-weight:800;color:#0d1b3e;letter-spacing:.015em}
.sektor{font-size:6.1pt;color:#8d7015;font-weight:700;letter-spacing:.11em;
 margin-top:0.9mm}
.muhur{position:absolute;right:5.6mm;bottom:5.2mm;width:13mm;
 text-align:center}
.muhur svg{display:block}   /* ölçü seal(49) ile satır içinde: 49px = 13mm */
.muhur b{display:block;font-size:4.8pt;letter-spacing:.14em;color:#8d7015;
 margin-top:0.7mm;font-weight:800}

/* ---------------- ARKA YÜZ ---------------- */
.arka{background:#0d1b3e}
.ic{color:#fff}
.plat{position:absolute;left:6.4mm;top:5.6mm;width:44mm}
.plat .ad{font-size:6.6pt;font-weight:800;letter-spacing:.16em;color:#fff;
 line-height:1.4}
.plat .slogan{font-size:4.6pt;letter-spacing:.13em;color:#c9a227;
 margin-top:0.8mm}
.ayrac{position:absolute;left:6.4mm;top:13.6mm;width:11mm;height:0.4mm;
 background:#c9a227}
.ile{position:absolute;left:6.4mm;top:17.4mm;width:47mm}
.ile .sat{display:flex;align-items:flex-start;gap:1.7mm;margin-bottom:1.9mm}
.ile .sat svg{width:2.9mm;height:2.9mm;flex:none;margin-top:0.25mm;fill:#c9a227}
.ile .sat span{font-size:6.3pt;line-height:1.28;color:#eef1f8;
 word-break:break-word;letter-spacing:.006em}
.qr{position:absolute;right:6.2mm;top:50%;transform:translateY(-50%);
 width:21.5mm;text-align:center}
.qr .kutu{background:#fff;border-radius:1.2mm;padding:1.1mm}
.qr svg{display:block;width:19.3mm;height:19.3mm}
.qr b{display:block;font-size:4.4pt;letter-spacing:.1em;color:#aeb8d0;
 margin-top:1.1mm;font-weight:700}
.uyeno{position:absolute;left:6.4mm;bottom:5.2mm;font-size:4.9pt;
 letter-spacing:.15em;color:#8e9ab8;font-weight:700}
</style></head>
